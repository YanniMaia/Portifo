<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Página 404 estática (D-03): fora do React e sem o bundle. Textos = erro404.titulo e
         erro404.voltar de src/content/pt.ts (V1 só PT, doc 09). Meta, style crítico e script de tema
         são cópia exata do index.html (F-08); caminhos absolutos com o BASE_PATH de src/site.config.ts,
         porque o Vite copia public/ sem reescrever. Tudo conferido por tests/unit/deploy/pagina-404.test.ts. -->
    <meta name="theme-color" content="#FFF7FA" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #ffffff;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #150a10;
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        var d = document.documentElement,
          s = null,
          l = null,
          t = 'light';
        try {
          s = localStorage.getItem('ye-theme');
          l = localStorage.getItem('ye-lang');
        } catch (e) {}
        if (s === 'light' || s === 'dark') t = s;
        else
          try {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {}
        d.setAttribute('data-theme', t);
        d.setAttribute('lang', l === 'en' ? 'en' : 'pt-BR');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#150A10' : '#FFF7FA');
      })();
    </script>
    <meta name="robots" content="noindex" />
    <title>Página não encontrada</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Tokens do DS-01 (src/styles/tokens/colors.css): --color-bg, --color-text, --color-link. */
      :root {
        --bg: #ffffff;
        --texto: #2b1620;
        --link: #c93a77;
      }
      html[data-theme='dark'] {
        --bg: #150a10;
        --texto: #fdf0f5;
        --link: #ffb3d1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--texto);
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 32px 20px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 40px);
        font-weight: 800;
        line-height: 1.2;
      }
      a {
        color: var(--link);
        font-size: 18px;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 4px;
        padding: 10px 4px;
      }
      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="72" height="72" />
      <h1>Página não encontrada</h1>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
